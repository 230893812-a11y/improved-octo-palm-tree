<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="黄鼎的个人摄影空间，用影像记录天空、自然与城市之间的光线变化。"><meta name="theme-color" content="#080d11"><title>光影观察 · 黄鼎摄影空间</title><link rel="stylesheet" href="style.css?v=spiral2">

<body>
<div class="stars" aria-hidden="true"></div><div class="space-glow" aria-hidden="true"></div>
<header class="topbar"><a class="back-link" href="../#media">← 返回简历</a><div class="brand"><b>HUANG DING</b><span>VISUAL NOTES / 2026</span></div><button class="help-button" id="helpButton" type="button" aria-expanded="false" aria-controls="helpPanel">操作说明</button></header>
<main>
<section class="intro" aria-labelledby="pageTitle"><p class="eyebrow">PERSONAL VISUAL ARCHIVE · 22 FRAMES</p><h1 id="pageTitle">聚微光，<br><em>成星河</em></h1><p class="intro-copy">用手机记录天空、植物、山水与城市之间的光线变化。拖动或滚动，让影像在空间中流动。</p></section>
<section class="gallery-shell" aria-label="3D 摄影空间"><div class="gallery-status"><span id="currentFrame">FRAME 05 / 22</span><b id="loadStatus">正在布置影像空间…</b></div><div class="scene" id="scene" tabindex="0" aria-label="拖动、滑动或滚轮浏览照片，点击照片查看大图"><div class="camera" id="camera"><div class="photo-ring" id="photoRing"></div></div><div class="scene-core" aria-hidden="true"><i></i><span>HD</span><small>LIGHT / SPACE</small></div></div><div class="controls" aria-label="画廊控制"><button id="previousButton" type="button" aria-label="上一张">←</button><button id="focusButton" type="button">查看当前照片</button><button id="nextButton" type="button" aria-label="下一张">→</button><button id="zoomOutButton" type="button" aria-label="缩小">−</button><button id="zoomInButton" type="button" aria-label="放大">＋</button></div><p class="gesture-hint"><strong>拖动 / 滚轮浏览空间</strong><span>点击照片查看大图</span></p></section>
<aside class="help-panel" id="helpPanel" hidden><b>如何浏览</b><p>电脑：左右拖动或滚动滚轮切换照片；手机：单指左右滑动。点击任意照片查看大图，下方 ＋ / − 调整空间远近。</p></aside>
</main>
