<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>浪尖儿·坦克大战 | 黄鼎</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header><div><span class="eyebrow">HD · WAVE EDGE COMMUNITY</span><h1>浪尖儿·坦克大战</h1><p>轻量 JavaScript 快速体验版</p></div><button id="sound" class="ghost" aria-label="切换音效">🔊 音效</button></header>
    <section class="game-card"><div class="hud"><span>生命 <b id="lives">3</b></span><span>分数 <b id="score">0</b></span><span>敌人 <b id="remaining">10</b></span><button id="pause" class="mini">暂停</button></div><canvas id="game" width="640" height="480" aria-label="坦克大战游戏区域"></canvas><div id="overlay" class="overlay"><h2>准备出击</h2><p>WASD / 方向键移动，空格或 J 射击</p><button id="start">开始游戏</button></div></div>
    <div class="controls"><div class="joystick" aria-hidden="true"><span></span></div><div class="dpad"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button data-key="Space" class="fire">发射</button></div>
    <footer>基于原 Python/Pygame 版玩法重构 · Canvas + JavaScript · 无需安装</footer>
  </main><script src="game.js?v=20260905-hitfix"></script>
</body></html>
